<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador: fuerzas en plano inclinado</title>
<style>
:root{
  --color-text-primary:#1f2328;
  --color-text-secondary:#57606a;
  --color-text-tertiary:#8c959f;
  --color-text-danger:#cf222e;
  --color-text-success:#1a7f37;
  --color-background-primary:#ffffff;
  --color-background-secondary:#f6f8fa;
  --color-border-secondary:#d0d7de;
  --color-border-tertiary:#eaeef2;
  --border-radius-md:6px;
}
html,body{margin:0;padding:14px;background:#ffffff;color:#1f2328;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.4}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.srow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slbl{font-size:13px;color:var(--color-text-secondary);min-width:158px}
.sval{font-size:14px;font-weight:500;min-width:54px;text-align:right;color:var(--color-text-primary)}
.fcard{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px}
.flbl{font-size:11px;color:var(--color-text-secondary);margin:0 0 3px}
.fval{font-size:17px;font-weight:500;margin:0}
</style>
</head>
<body>

<h2 class="sr-only">Simulador interactivo de fuerzas en plano inclinado — ajusta ángulo, masa y coeficiente de roce</h2>

<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
  <span id="sdot" style="width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;transition:background .25s"></span>
  <span id="stxt" style="font-size:14px;font-weight:500;transition:color .25s"></span>
  <span id="scnd" style="font-size:12px;color:var(--color-text-secondary);margin-left:4px"></span>
</div>

<svg width="100%" viewBox="0 0 680 460" role="img" style="margin-bottom:16px">
  <title>Diagrama de fuerzas en plano inclinado</title>
  <desc>Plano inclinado con vectores de peso, normal, roce y componente paralela, actualizados dinámicamente.</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Legend -->
  <g transform="translate(18,18)">
    <rect width="192" height="139" rx="8" fill="var(--color-background-primary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <text x="14" y="20" style="font-size:10px;letter-spacing:.8px;font-weight:500;fill:var(--color-text-secondary)">LEYENDA</text>
    <line x1="14" y1="38" x2="40" y2="38" stroke="#D62828" stroke-width="2.5" marker-end="url(#arw)"/>
    <text x="46" y="42" style="font-size:11px;fill:var(--color-text-primary)">Peso  P = mg</text>
    <line x1="14" y1="61" x2="40" y2="61" stroke="#78BF26" stroke-width="2.5" marker-end="url(#arw)"/>
    <text x="46" y="65" style="font-size:11px;fill:var(--color-text-primary)">Normal  N</text>
    <line x1="14" y1="84" x2="40" y2="84" stroke="#C0165A" stroke-width="2.5" marker-end="url(#arw)"/>
    <text x="46" y="88" style="font-size:11px;fill:var(--color-text-primary)">Roce  fₖ = μN</text>
    <line x1="14" y1="107" x2="40" y2="107" stroke="#F07F00" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arw)"/>
    <text x="46" y="111" style="font-size:11px;fill:var(--color-text-primary)">Comp. paralela  Px</text>
    <line x1="14" y1="130" x2="40" y2="130" stroke="#7950F2" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arw)"/>
    <text x="46" y="134" style="font-size:11px;fill:var(--color-text-primary)">Comp. perpendicular  Py</text>
  </g>

  <!-- Dynamic: ground -->
  <g id="gnd"></g>
  <!-- Dynamic: triangle -->
  <polygon id="plane" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
  <!-- Dynamic: angle arc + label -->
  <path id="ang-arc" fill="none" stroke="var(--color-text-tertiary)" stroke-width="1.3"/>
  <text id="ang-lbl" text-anchor="middle" dominant-baseline="central" style="font-size:13px;font-weight:500;fill:var(--color-text-primary)"></text>
  <!-- Dynamic: block -->
  <g id="block">
    <rect x="-23" y="-15" width="46" height="30" rx="4" fill="#C8DEFF" stroke="#004EAA" stroke-width="1.5"/>
    <text x="0" y="1" text-anchor="middle" dominant-baseline="central" style="font-size:12px;font-weight:500;fill:#003882">m</text>
  </g>
  <!-- Arrow lines -->
  <line id="aP"  stroke="#D62828" stroke-width="2.5" marker-end="url(#arw)"/>
  <line id="aN"  stroke="#78BF26" stroke-width="2.5" marker-end="url(#arw)"/>
  <line id="afk" stroke="#C0165A" stroke-width="2.5" marker-end="url(#arw)"/>
  <line id="aPx" stroke="#F07F00" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arw)"/>
  <line id="aPy" stroke="#7950F2" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arw)"/>
  <!-- Arrow labels -->
  <text id="tlP"  text-anchor="start" style="font-size:12px;font-weight:500;fill:#D62828"></text>
  <text id="tlN"  text-anchor="end"   style="font-size:12px;font-weight:500;fill:#78BF26"></text>
  <text id="tlfk" text-anchor="start" style="font-size:12px;font-weight:500;fill:#C0165A"></text>
  <text id="tlPx" text-anchor="end"   style="font-size:11px;fill:#F07F00"></text>
  <text id="tlPy" text-anchor="start" style="font-size:11px;fill:#7950F2"></text>
</svg>

<!-- Sliders -->
<div style="padding:0 2px">
  <div class="srow">
    <span class="slbl">Ángulo θ</span>
    <input type="range" min="0" max="80" step="1" value="30" id="sl-theta" style="flex:1" oninput="render()">
    <span class="sval" id="vl-theta">30°</span>
  </div>
  <div class="srow">
    <span class="slbl">Masa m (kg)</span>
    <input type="range" min="1" max="20" step="1" value="10" id="sl-m" style="flex:1" oninput="render()">
    <span class="sval" id="vl-m">10 kg</span>
  </div>
  <div class="srow">
    <span class="slbl">Coef. de roce μ</span>
    <input type="range" min="0" max="1" step="0.01" value="0.30" id="sl-mu" style="flex:1" oninput="render()">
    <span class="sval" id="vl-mu">0.30</span>
  </div>
</div>

<!-- Force cards -->
<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:16px">
  <div class="fcard"><p class="flbl">Peso  P</p><p class="fval" id="cv-P" style="color:#D62828"></p></div>
  <div class="fcard"><p class="flbl">Normal  N</p><p class="fval" id="cv-N" style="color:#78BF26"></p></div>
  <div class="fcard"><p class="flbl">Comp. ∥  Px</p><p class="fval" id="cv-Px" style="color:#F07F00"></p></div>
  <div class="fcard"><p class="flbl">Comp. ⊥  Py</p><p class="fval" id="cv-Py" style="color:#7950F2"></p></div>
  <div class="fcard"><p class="flbl">Roce  fₖ</p><p class="fval" id="cv-fk" style="color:#C0165A"></p></div>
</div>

<script>
const G=9.8, HYPO=260, BRX=440, BRY=350, ASC=0.60, AMAX=100;
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);

function setArrow(id,x1,y1,x2,y2){
  const e=$(id), len=Math.hypot(x2-x1,y2-y1);
  e.style.visibility=len<1.5?'hidden':'visible';
  e.setAttribute('x1',x1.toFixed(1)); e.setAttribute('y1',y1.toFixed(1));
  e.setAttribute('x2',x2.toFixed(1)); e.setAttribute('y2',y2.toFixed(1));
}

function setLabel(id,x,y,text){
  const e=$(id);
  e.setAttribute('x',x.toFixed(1));
  e.setAttribute('y',y.toFixed(1));
  e.textContent=text;
  e.style.visibility=text?'visible':'hidden';
}

function svgEl(tag,attrs){
  const e=document.createElementNS(NS,tag);
  for(const[k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  return e;
}

function render(){
  const deg=+$('sl-theta').value, m=+$('sl-m').value, mu=+$('sl-mu').value;
  $('vl-theta').textContent=deg+'°';
  $('vl-m').textContent=m+' kg';
  $('vl-mu').textContent=mu.toFixed(2);

  const th=deg*Math.PI/180, ct=Math.cos(th), st=Math.sin(th);
  const blX=BRX-HYPO*ct, blY=BRY, topX=BRX, topY=BRY-HYPO*st;

  $('plane').setAttribute('points',
    `${blX.toFixed(1)},${blY} ${BRX},${BRY} ${topX},${topY.toFixed(1)}`);

  // Ground
  const gnd=$('gnd'); gnd.innerHTML='';
  gnd.appendChild(svgEl('line',{
    x1:Math.max(20,blX-22).toFixed(1),y1:BRY,x2:BRX+22,y2:BRY,
    stroke:'var(--color-border-secondary)','stroke-width':2
  }));
  if(deg>3) gnd.appendChild(svgEl('line',{
    x1:BRX,y1:topY.toFixed(1),x2:BRX,y2:BRY,
    stroke:'var(--color-border-tertiary)','stroke-width':1,'stroke-dasharray':'4,3'
  }));
  for(let xi=Math.max(24,blX-14); xi<=BRX+20; xi+=16)
    gnd.appendChild(svgEl('line',{
      x1:xi.toFixed(1),y1:BRY,x2:(xi-10).toFixed(1),y2:BRY+10,
      stroke:'var(--color-border-secondary)','stroke-width':1
    }));

  // Block (midpoint of hypotenuse)
  const bx=blX+0.5*(topX-blX), by=blY+0.5*(topY-blY);
  $('block').setAttribute('transform',
    `translate(${bx.toFixed(1)},${by.toFixed(1)}) rotate(${(-deg).toFixed(1)})`);

  // Angle arc
  if(deg>2){
    const R=55;
    $('ang-arc').setAttribute('d',
      `M ${(blX+R).toFixed(1)},${blY} A ${R},${R} 0 0,0 ${(blX+R*ct).toFixed(1)},${(blY-R*st).toFixed(1)}`);
    setLabel('ang-lbl', blX+(R+18)*Math.cos(th/2), blY-(R+18)*Math.sin(th/2), 'θ');
  } else {
    $('ang-arc').setAttribute('d','');
    setLabel('ang-lbl',0,0,'');
  }

  // Physics
  const P=m*G, N=P*ct, Px=P*st, Py=N, fk=mu*N;
  const slides=Px>fk+0.01;
  const alen=f=>Math.min(AMAX,f*ASC);

  // P (↓ straight down)
  const pL=alen(P);
  setArrow('aP', bx, by, bx, by+pL);
  setLabel('tlP', bx+8, by+pL*0.5, 'P');

  // N (↖ direction: −sinθ, −cosθ)
  const nL=alen(N), nTx=bx-st*nL, nTy=by-ct*nL;
  setArrow('aN', bx, by, nTx, nTy);
  setLabel('tlN', nTx-5, nTy-10, 'N');

  // fk (↗ up the slope: cosθ, −sinθ)
  if(fk>0.3){
    const fL=alen(fk), fTx=bx+ct*fL, fTy=by-st*fL;
    setArrow('afk', bx, by, fTx, fTy);
    setLabel('tlfk', fTx+5, fTy-5, 'fₖ');
  } else {
    setArrow('afk',bx,by,bx,by);
    setLabel('tlfk',0,0,'');
  }

  // Px (↙ down the slope: −cosθ, sinθ) dashed
  if(Px>0.5){
    const pxL=alen(Px), pxTx=bx-ct*pxL, pxTy=by+st*pxL;
    setArrow('aPx', bx, by, pxTx, pxTy);
    setLabel('tlPx', pxTx-5, pxTy+12, 'Px');
  } else {
    setArrow('aPx',bx,by,bx,by);
    setLabel('tlPx',0,0,'');
  }

  // Py (↘ into surface: sinθ, cosθ) dashed
  if(Py>0.5){
    const pyL=alen(Py), pyTx=bx+st*pyL, pyTy=by+ct*pyL;
    setArrow('aPy', bx, by, pyTx, pyTy);
    setLabel('tlPy', pyTx+8, pyTy-5, 'Py');
  } else {
    setArrow('aPy',bx,by,bx,by);
    setLabel('tlPy',0,0,'');
  }

  // Status
  const tanTh=deg<89?Math.tan(th).toFixed(2):'∞';
  $('sdot').style.background=slides?'#D62828':'#78BF26';
  $('stxt').style.color=slides?'var(--color-text-danger)':'var(--color-text-success)';
  $('stxt').textContent=slides?'El bloque se desliza':'El bloque permanece en reposo';
  $('scnd').textContent=`tan(${deg}°) = ${tanTh}  ${slides?'>':'≤'}  μ = ${mu.toFixed(2)}`;

  // Cards
  $('cv-P').textContent=P.toFixed(1)+' N';
  $('cv-N').textContent=N.toFixed(1)+' N';
  $('cv-Px').textContent=Px.toFixed(1)+' N';
  $('cv-Py').textContent=Py.toFixed(1)+' N';
  $('cv-fk').textContent=fk.toFixed(1)+' N';
}
render();
</script>
</body>
</html>
